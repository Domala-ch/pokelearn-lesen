<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><title>PokeLearn Lesen</title>

<style>
:root{

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1727; --surface:#182238; --surface-2:#1f2b45; --ink:#eef2f8; --muted:#9fb0c8; --line:#2c3a56;
  --accent:#ff7a48; --accent-ink:#1a0d06; --teal:#2fc2d2; --gold:#f5c04a; --gold-ink:#2b1f00; --indigo:#5c7cfa;

  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1727; --surface:#182238; --surface-2:#1f2b45; --ink:#eef2f8; --muted:#9fb0c8; --line:#2c3a56;
  --accent:#ff7a48; --accent-ink:#1a0d06; --teal:#2fc2d2; --gold:#f5c04a; --gold-ink:#2b1f00; --indigo:#5c7cfa;
  --good:#4fcf86; --good-bg:#153726; --bad:#ff7070; --bad-bg:#44201f; --shadow:0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 18px;font-family:var(--display);font-weight:600;font-size:17px;background:var(--surface-2);border:1.5px solid var(--line);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.teal{background:var(--teal);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lvbtn.tried small{color:var(--gold)}}:root[data-theme="dark"] .lvbtn.tried small{color:var(--gold)}
.options{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:14px;background:var(--surface-2);border:2px solid var(--line);font-size:18px;font-weight:700}
.opt:hover{border-color:var(--teal)}
.opt.good{background:var(--good-bg);border-color:var(--good)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.dim{opacity:.5}
.feedback{border-radius:14px;padding:12px 14px;display:none;gap:4px}
.feedback.show{display:grid}
.feedback.good{background:var(--good-bg);border-left:5px solid var(--good)}
.feedback.bad{background:var(--bad-bg);border-left:5px solid var(--bad)}
.feedback b{font-family:var(--display);font-size:18px}
.big{font-family:var(--display);font-size:44px;font-weight:700;line-height:1}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.pill.lvl-leicht{background:var(--good-bg);color:var(--good);border-color:transparent}
.pill.lvl-mittel{background:var(--surface-2);color:var(--teal)}
.pill.lvl-schwer{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.lsstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.lsstats div{background:var(--surface);border-radius:14px;padding:8px 4px;box-shadow:var(--shadow)}
.lsstats b{display:block;font-family:var(--display);font-size:22px;line-height:1.1}.lsstats small{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.lstext{font-size:21px;line-height:1.95;font-weight:600;overflow-wrap:anywhere;transition:filter .3s}
.lstext.blur{filter:blur(7px);user-select:none;pointer-events:none}
.lw{padding:2px 2px;border-radius:6px;cursor:pointer;transition:background .2s,color .2s}
.lw.cur{background:color-mix(in srgb,var(--gold) 38%,transparent)}
.lw.done{color:var(--muted)}
.lw.bad{color:var(--bad);text-decoration:underline wavy var(--bad);text-underline-offset:4px;background:var(--bad-bg)}
.lw.say{background:var(--gold);color:var(--gold-ink);box-shadow:0 0 0 3px var(--gold)}
.lw.ok{background:var(--good-bg);color:var(--good);font-weight:800}
.lw.ok.soft{background:transparent;font-weight:700;opacity:.8}
.lw.ok.fixed{text-decoration:underline dotted var(--good);text-underline-offset:5px}
.lw.retry{animation:nowp .8s ease-in-out infinite}
.lw.retry.t1{background:color-mix(in srgb,var(--gold) 55%,transparent);color:var(--ink);box-shadow:0 0 0 3px var(--gold)}
.lw.retry.t2{background:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.lw.retry.t3{background:var(--bad-bg);color:var(--bad);box-shadow:0 0 0 3px var(--bad)}
.lsretry{display:none!important}.lsretry-old{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:8px 12px;animation:stoppulse .9s ease-in-out infinite}
.lsfocus.stopped .lw.dim{opacity:.45}
.lw.badw{background:var(--bad-bg);color:var(--bad);font-weight:800}
.lw.miss{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px;opacity:.75}
.lw.now{background:color-mix(in srgb,var(--gold) 45%,transparent);box-shadow:0 0 0 3px var(--gold);animation:nowp .9s ease-in-out infinite}
@keyframes nowp{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--gold) 35%,transparent)}}
.lsfocus{position:fixed;left:0;right:0;top:0;height:100%;z-index:45;background:var(--bg);display:flex;flex-direction:column;gap:8px;padding-top:max(8px,env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.lsstrip{flex:none;display:grid;grid-template-columns:minmax(0,1fr);min-width:0;gap:8px;align-items:center;background:var(--surface);border-radius:14px;padding:8px;box-shadow:var(--shadow)}
.lsheard{font-size:18px;line-height:1.3;font-weight:700;height:60px;overflow:hidden;padding:5px 10px;border-radius:10px;background:var(--surface-2);overflow-wrap:anywhere;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.lsheard .muted{font-weight:600;font-size:14px}.lsheard .micdot{flex:none}
.lsstrip.live textarea{display:none}.lsbtns{display:flex;gap:8px;flex-wrap:wrap}.lsbtns .primary{flex:1}
.lsstrip textarea{min-height:44px;max-height:44px;font-size:16px;min-width:0;padding:8px 10px;resize:none;overflow:hidden;line-height:1.3}
.lsmini{flex:none;display:flex;gap:12px;flex-wrap:nowrap;overflow:hidden;white-space:nowrap;font-size:13px;font-weight:800;color:var(--muted);padding:0 4px;height:20px}
.lsmini b{color:var(--ink);font-variant-numeric:tabular-nums}
.lsscroll{position:relative;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 4px 45vh;overscroll-behavior:contain}
.lsscroll .lstext{font-size:20px;line-height:1.9}
.lsfocus{overflow:hidden;max-width:100vw}.lsscroll{overflow-x:hidden}
.lsscroll .lw{transition:background .25s,color .25s}
.lsscroll .lw.ok,.lsscroll .lw.badw,.lsscroll .lw.ok.soft{font-weight:inherit}  /* colour only, never width: lines must not re-wrap while reading */
.lswarn{grid-column:1/-1;background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:700}
.lsdict{font-size:17px;min-height:64px;max-height:110px;border-color:var(--accent);border-width:2px}
.micdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:6px;animation:nowp 1.2s infinite}
.lsbar{position:sticky;bottom:0;display:grid;gap:8px;padding-block:10px;background:linear-gradient(transparent,var(--bg) 30%)}
.stars{font-size:34px;letter-spacing:6px;color:var(--gold)}
.pill{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.stat{display:grid;gap:2px}.stat b{font-family:var(--display);font-size:26px;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
main{flex:1;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:640px;width:100%;margin:0 auto;display:grid;gap:14px;align-content:start}
.bigmic{width:120px;height:120px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;justify-self:center;box-shadow:0 8px 24px rgba(255,107,53,.4)}
.bigmic svg{width:54px;height:54px}.bigmic:active{transform:scale(.96)}
.codebox{font-family:var(--display);font-size:40px;letter-spacing:.14em;text-align:center;padding:14px;border-radius:16px;background:var(--surface-2);border:2px dashed var(--accent);user-select:all}
.lvl{height:6px;background:var(--line);border-radius:4px;overflow:hidden;grid-column:1/-1}.lvl i{display:block;height:100%;width:0;background:var(--good)}
.hidden{display:none!important}
</style></head><body>

<script>
const pick=a=>a[Math.floor(Math.random()*a.length)];
const today=()=>new Date().toISOString().slice(0,10);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const LANGN={de:"Deutsch",fr:"Französisch",en:"Englisch"};
const VL={de:["de-CH","de-DE","de"],fr:["fr-CH","fr-FR","fr"],en:["en-GB","en-US","en"]};
const TEMPO={langsam:{rate:.82,read:.9,spw:2600},mittel:{rate:.9,read:.96,spw:1900},schnell:{rate:.98,read:1.02,spw:1300}};
const TOKRE=/[\p{L}\p{M}\p{N}]+(?:['’\-][\p{L}\p{M}\p{N}]+)*|[.,!?;:«»"„“”‹›()–—\-]/gu;
const QUOTES=new Set(["«","»",'"',"„","“","”","‹","›"]);
const isPunct=t=>!/[\p{L}\p{N}]/u.test(t);
const tnorm=t=>QUOTES.has(t)?'"':t.replace(/’/g,"'").replace(/[–—]/g,"-");
const rid=()=>Math.random().toString(36).slice(2,9);
function toks(s){let st=false;return(String(s).match(TOKRE)||[]).map(t=>{let q=false;if(t==="«"||t==="„"||t==="‹"){q=true;st=true}else if(t==="»"||t==="›"){st=false}else if(t==='"'||t==="“"||t==="”"){q=!st;st=q}return{t,q}})}
const CLOSEP=/^[,.!?;:)»›]$/;
function needSpace(p,n){if(!p||!n)return false;if(CLOSEP.test(n.t))return false;if(QUOTES.has(n.t)&&!n.q)return false;if(p.t==="("||(QUOTES.has(p.t)&&p.q))return false;return true}
function joinPlain(T){let o="";T.forEach((tk,i)=>{o+=(i&&needSpace(T[i-1],tk)?" ":"")+tk.t});return o}
const dkWords=T=>T.filter(t=>!isPunct(t.t)).length;
const ttsOK=()=>{try{return "speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined"}catch(e){return false}};
function acGet(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{AC=new C()}catch(e){return null}}return AC}
function acUnlock(){const c=acGet();if(!c)return;try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}try{if(c.state!=="running")c.resume().catch(()=>{})}catch(e){}try{const b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0)}catch(e){}
function hashStr(s){let h=2166136261;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
const IC={play:'<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>',
 pause:'<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
 back:'<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M5 5h2.5v14H5zM20 5v14L9 12z"/></svg>',
 again:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg>',
 check:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>'};

const STANDALONE=true;let AC=null,tT;const S={lsStop:true,lsMN:false,dkTempo:"mittel",grade:6,lsSeen:[],history:{},coins:0};const save=()=>{};const sample=null;const LEVELS=["leicht","mittel","schwer"];
const gradeOf=()=>S.grade;const gainTxt=n=>n+" Punkte";const celebrate=(a,b)=>toast(a+" "+b);const show=()=>{};const showView=()=>{};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("show"),2200)}
function dkVoice(lang){try{const vs=speechSynthesis.getVoices().filter(v=>String(v.lang).toLowerCase().startsWith(lang));const pref=VL[lang].map(x=>x.toLowerCase());vs.sort((a,b)=>(pref.indexOf(String(a.lang).toLowerCase())+1||9)-(pref.indexOf(String(b.lang).toLowerCase())+1||9));return vs[0]||null}catch(e){return null}}
function speak(text,lang,rate,pitch){return new Promise(res=>{if(!ttsOK())return res("unsupported");let done=false,to;const fin=r=>{if(done)return;done=true;clearTimeout(to);res(r)};
 try{const u=new SpeechSynthesisUtterance(text);const v=dkVoice(lang);if(v)u.voice=v;u.lang=v?v.lang:VL[lang][0];u.rate=rate;u.pitch=pitch||1;u.onend=()=>fin("ok");u.onerror=e=>fin((e&&e.error)||"error");to=setTimeout(()=>fin("ok"),text.length*110/rate+5000);speechSynthesis.speak(u)}catch(e){fin("error")}})}

const LSB=[];
const LSTARGET={leicht:90,mittel:110,schwer:120};   // words per minute reading aloud, guide values for grade 6
const LSINFO={leicht:"ca. 110 Wörter · Geschichten und einfache Sachtexte",mittel:"ca. 135 Wörter · längere Sätze, Sachwissen",schwer:"ca. 145 Wörter · anspruchsvolle Sachtexte, Fremdwörter"};
const LSGENSPEC={leicht:"100 bis 120 Wörter, klare Sätze, Wortschatz der Mittelstufe",mittel:"125 bis 145 Wörter, Haupt- und Nebensätze, einige Fachwörter mit Erklärung im Text",schwer:"140 bis 165 Wörter, anspruchsvoller Satzbau, Fremd- und Fachwörter, Zahlen als Wörter"};
const LSTOPIC=["der Bartgeier kehrt in die Alpen zurück","wie ein Gletscher entsteht und schmilzt","die Geschichte der Schweizer Schokolade","warum Zugvögel im Herbst nach Süden fliegen","wie eine Luftseilbahn funktioniert","Murmeltiere im Winterschlaf","der Rhein von der Quelle bis zum Meer","wie Käse auf der Alp hergestellt wird","Polarlichter","die Erfindung des Velos","wie Bäume über ihre Wurzeln miteinander verbunden sind","Ameisen und ihr Staat","wie der Wetterbericht entsteht","die ersten Menschen in den Alpen","ein Abenteuer im Klassenlager","ein Mädchen, das einen Roboter baut","ein Wettlauf gegen die Zeit beim Bahnhof","ein verlorener Hund findet nach Hause","eine Nacht im Naturhistorischen Museum","der Biber in Schweizer Flüssen","wie ein Regenbogen entsteht","Fledermäuse und ihr Ultraschall","die Rettungsflugwacht in den Bergen","ein Geheimnis auf dem Flohmarkt"];
let LS=null;
const lsTexts=()=>[...LSB,...(S.genLese||[])];
const lsSeenSet=()=>new Set([...(S.lsSeen||[]),...(S.lsHist||[]).map(x=>x.tid)]);
const lsBankLeft=lv=>{const s=lsSeenSet();return LSB.filter(t=>t.level===lv&&!s.has(t.id))};
function lsRecommend(){const H=S.lsHist||[];if(!H.length)return{level:"mittel",why:"Zum Einstieg passt «Mittel», das entspricht etwa deiner Klasse."};
 const l=H[0],i=LEVELS.indexOf(l.level),qp=l.qn?l.q/l.qn:0,fast=l.wpm&&l.wpm>=LSTARGET[l.level];
 const f=`Letztes Mal ${l.q} von ${l.qn} Fragen richtig${l.wpm?` und ${l.wpm} Wörter pro Minute`:""} bei «${l.level[0].toUpperCase()+l.level.slice(1)}»`;
 if(qp>=.75&&(fast||!l.wpm)&&i<2)return{level:LEVELS[i+1],why:f+". Du bist bereit für die nächste Stufe!"};
 if(qp<.5&&i>0)return{level:LEVELS[i-1],why:f+". Übe zuerst eine Stufe leichter."};
 return{level:l.level,why:f+". Bleib noch bei dieser Stufe."}}
function lsStop(){if(!LS)return;clearInterval(LS._poll);lsStopSR(LS);LS.gen=(LS.gen||0)+1;try{speechSynthesis.cancel()}catch(e){}clearInterval(LS.timer);LS.timer=null}
function lsRender(){const v=document.getElementById("lsView");if(!v)return;if(!LS||LS.phase==="list")return lsList(v);if(LS.phase==="board")return lsBoard(v);if(LS.phase==="quiz")return lsQuiz(v);if(LS.phase==="result")return lsResult(v);lsReader(v)}
function lsList(v){const rec=lsRecommend(),sel=S.lsLevel||rec.level,left=lsBankLeft(sel).length,H=(S.lsHist||[]).slice(0,4);
 v.innerHTML=`<div class="row"><button class="btn small ghost" data-la="home">← Zurück</button><button class="btn small" data-la="board" style="margin-left:auto">Bestenliste</button></div>
 <div><p class="eyebrow">Lesen üben</p><h1 style="font-size:28px">Lies laut vor!</h1><p class="muted" style="max-width:62ch">Lies den Text laut vor. Der Satz, bei dem du gerade bist, leuchtet. Nach jedem Satz tippst du auf «Satz gelesen». Danach beantwortest du vier Fragen zum Text. Punkte gibt es für jedes gelesene Wort, für richtige Antworten und für gutes Tempo.</p></div>
 <div style="display:grid;gap:8px"><p class="eyebrow" style="margin:0">Schwierigkeit wählen</p>
  <div class="lvgrid">${LEVELS.map(l=>`<button class="lvcard ${l===sel?"on":""}" data-lslvl="${l}"><span class="row" style="gap:6px;justify-content:space-between"><b>${l[0].toUpperCase()+l.slice(1)}</b>${l===rec.level?'<span class="pill good">Empfohlen</span>':""}</span><small class="muted">${LSINFO[l]} · Ziel ${LSTARGET[l]} Wörter/Min.</small>${(n=>n?`<span class="lvdone">✓ ${n} gelesen</span>`:"")((S.lsHist||[]).filter(x=>x.level===l).length)}</button>`).join("")}</div>
  <p class="muted" style="margin:0;font-size:14px"><b>Empfehlung:</b> ${esc(rec.why)}</p></div>
 <div class="card" style="display:grid;gap:10px">

function readPayload(){const m=location.hash.match(/[#&]r=([^&]+)/);if(!m)return null;try{const o=JSON.parse(b64d(m[1]));if(!o||!o.text||!o.id)return null;return o}catch(e){return null}}
function view(){return document.getElementById("lsView")}
const MIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>';
const SRok=()=>!!(window.SpeechRecognition||window.webkitSpeechRecognition);
// ---- screens ----
function readyView(){const L=LS,t=L.text;view().innerHTML=`
 <div class="row" style="justify-content:space-between"><span class="pill lvl-${esc(t.level||"mittel")}">${esc(t.level||"")}${t.kind?" · "+esc(t.kind):""}</span><span class="pill">${esc(LANGN[t.lang||"de"]||"")}</span></div>
 <div class="card" style="display:grid;gap:14px;text-align:center"><p class="eyebrow">PokeLearn Lesen${P&&P.name?" · "+esc(P.name):""}</p><h1 style="font-size:26px;color:var(--accent)">${esc(t.title)}</h1>
  <button class="bigmic" data-la="mic" aria-label="Mit Mikrofon lesen">${MIC}</button>
  <div class="row" style="justify-content:center;gap:6px"><span class="muted" style="font-size:13px">Mikrofon hört:</span>${["de","fr","en"].map(l=>`<button class="pill ${(L.srLang||t.lang||"de")===l?"good":""}" data-lang="${l}" style="font-size:13px">${LANGN[l]}</button>`).join("")}</div>
  <p style="margin:0;font-size:18px;font-weight:800">Tippe aufs Mikrofon und lies laut vor.</p>
  <p class="muted" style="margin:0;font-size:14px">${SRok()?"Beim ersten Mal fragt dich das Gerät, ob diese Seite das Mikrofon benutzen darf – tippe auf «Erlauben».":"Dieses Gerät kann hier nicht direkt zuhören – du kannst das Mikrofon der Tastatur benutzen."}</p></div>
 <div class="card"><div class="lstext blur" id="lsText">${lsTextHtml()}</div></div>
 <p class="muted" style="margin:0;font-size:13px;text-align:center">Grün = richtig gelesen · gelb/orange = nochmals lesen · nach drei Versuchen wird das Wort vorgelesen.</p>`}
function resultView(){const L=LS,r=L.res,t=L.text;const bad=L.W.filter((ti,k)=>L.wst[k]==="bad"||L.wst[k]==="miss");
 view().innerHTML=`
 <div class="card" style="display:grid;gap:10px;text-align:center"><p class="eyebrow">Fertig gelesen</p><div class="stars">${"★".repeat(r.stars)}<span style="opacity:.25">${"★".repeat(3-r.stars)}</span></div>
  <h1 style="font-size:26px">${r.stars===3?"Ausgezeichnet!":r.stars===2?"Sehr gut!":"Gut gemacht!"}</h1>
  <p style="margin:0">Dein <b>Lese-Code</b> für PokeLearn:</p><div class="codebox" id="code">${r.code}</div>
  <p class="muted" style="margin:0;font-size:14px">Geh zurück zu PokeLearn und tippe den Code ein – dann kommen die Fragen zum Text und deine Punkte.</p>
  <div class="row" style="justify-content:center"><button class="btn primary" data-la="back">← Zurück zu PokeLearn</button><button class="btn ghost small" data-la="copy">Code kopieren</button></div></div>
 <div class="grid2"><div class="card stat"><b class="num">${r.acc}%</b><span class="muted">richtig gelesen</span></div><div class="card stat"><b class="num">${r.errs}</b><span class="muted">Lesefehler</span></div><div class="card stat"><b class="num">${r.wpm||"–"}</b><span class="muted">Wörter pro Minute</span></div><div class="card stat"><b class="num">${r.words}</b><span class="muted">Wörter</span></div></div>
 ${r.fixed||r.given?`<p class="muted" style="margin:0">${r.fixed?`${r.fixed} ${r.fixed===1?"Wort":"Wörter"} selbst verbessert. `:""}${r.given?`${r.given} ${r.given===1?"Wort wurde":"Wörter wurden"} nach drei Versuchen vorgelesen.`:""}</p>`:""}
 ${bad.length?`<div class="card"><p class="eyebrow" style="margin:0 0 8px">Diese Wörter nochmals üben – antippen zum Anhören</p><div class="row">${bad.map(i=>`<button class="btn small" data-lsword="${i}">${esc(L.T[i].t)} ${IC.play}</button>`).join("")}</div></div>`:""}
 <button class="btn ghost" data-la="again">Nochmals lesen</button>`}
// the engine calls this when the last word was read
lsFinishReading=function(){const L=LS;lsStopSR(L);if(L.t0){L.ms+=Date.now()-L.t0;L.t0=0}clearInterval(L.timer);L.timer=null;L.phase="result";
 const words=L.W.length,secs=Math.max(1,Math.round(L.ms/1000)),errs=L.wst.filter(x=>x==="bad"||x==="miss").length;let wpm=Math.round(Math.max(1,L.pos)/(secs/60));if(wpm>260)wpm=0;
 const acc=Math.round(Math.max(0,1-errs/words)*100),stars=errs<=2?3:errs<=6?2:1;
 L.res={words,errs,acc,wpm,stars,fixed:L.fixed||0,given:L.given||0,code:lesCode(L.text.id,acc,errs,wpm)};lsBeep(true);resultView();window.scrollTo(0,0)};
const _lsStartSR=lsStartSR;lsStartSR=function(){const L=LS;if(L&&L.srLang)L.text.lang=L.srLang;_lsStartSR();if(L&&L.sr){const r=L.sr,oe=r.onerror;r.onerror=e=>{if(e.error==="language-not-supported"){const F={"fr-CH":"fr-FR","en-GB":"en-US","de-CH":"de-DE"}[r.lang];if(F){SRLANG[L.text.lang||"de"]=F;L.sr=null;setTimeout(lsStartSR,50);return}}oe&&oe(e)}}};
lsRender=function(){const L=LS;if(!L)return;if(L.phase==="reading"&&L.mode==="mic")return lsReader(view());if(L.phase==="result")return resultView();readyView()};
// keep the current strip text useful: show what is being heard, hide the keyboard field while direct listening works
const _lsMicUI=lsMicUI;lsMicUI=function(){_lsMicUI();const L=LS,fx=document.getElementById("lsFocus"),ta=document.getElementById("lsDict"),how=document.getElementById("lsHow");if(!L||!fx)return;
 fx.classList.toggle("live",!!L.srLive);if(ta)ta.classList.toggle("hidden",!!L.srLive);
 if(how&&!L.srLive&&!SRok())how.innerHTML="<b>Tippe ins Feld und dann auf das Mikrofon der Tastatur.</b> Dann lies laut vor."};
const _lsUpd=lsUpdateFromHeard;lsUpdateFromHeard=function(){_lsUpd();const L=LS,how=document.getElementById("lsHow"),ta=document.getElementById("lsDict");if(L&&L.srLive&&how&&ta){const w=ta.value.trim().split(/\s+/).slice(-6).join(" ");how.innerHTML=w?`<span class="muted">Ich höre:</span> ${esc(w)}`:"<b>Ich höre zu.</b> Lies einfach laut vor."}};
function startMic(){const L=LS;acUnlock();try{speechSynthesis.cancel()}catch(e){}L.gen=(L.gen||0)+1;L.mode="mic";L.phase="reading";L.read=true;L.pos=0;L.wst=[];L._done=false;L.srLive=false;lsReader(view());
 if(SRok()){lsStartSR();if(lsSRBlocked){const how=document.getElementById("lsHow");if(how)how.innerHTML="<b>Das Mikrofon wurde nicht erlaubt.</b> Erlaube es in den Einstellungen (Safari › Mikrofon) oder benutze das Mikrofon der Tastatur.";const ta=document.getElementById("lsDict");if(ta)ta.classList.remove("hidden")}}
 else{const ta=document.getElementById("lsDict");if(ta)ta.focus()}}
view().addEventListener("click",e=>{const L=LS;
 const w=e.target.closest(".lw");if(w&&L&&L.phase==="reading"){try{speechSynthesis.cancel()}catch(x){}speak(L.T[+w.dataset.wi].t,L.text.lang||"de",.8);return}
 const sw=e.target.closest("[data-lsword]");if(sw&&L){speak(L.T[+sw.dataset.lsword].t,L.text.lang||"de",.8);return}
 const lg0=e.target.closest("[data-lang]");if(lg0&&L){L.srLang=lg0.dataset.lang;L.text.lang=lg0.dataset.lang;LSLANG=lg0.dataset.lang;lsRender();return}
 const b=e.target.closest("[data-la]");if(!b||!L)return;const a=b.dataset.la;
 if(a==="mic")return startMic();
 if(a==="micExit"){lsStop();L.mode=null;L.phase="ready";L.ms=0;L.t0=0;L.wst=[];L.pos=0;lsRender();return}
 if(a==="micClear"){L._done=false;clearTimeout(L._endT);L.fin=null;L.retry=null;L.cur=[];const ta=document.getElementById("lsDict");if(ta){ta.value="";if(!L.srLive)ta.focus()}if(L.sr){lsStopSR(L);lsStartSR()}L.wst=[];L.pos=0;L.ms=0;L.t0=0;clearInterval(L.timer);L.timer=null;lsClock();lsPaint();return}
 if(a==="micDone"){if(!L.pos){toast("Noch nichts gehört. Lies laut vor.");return}lsFinishReading();return}
 if(a==="again"){lsStop();boot();return}
 if(a==="copy"){try{navigator.clipboard.writeText(L.res.code);toast("Code kopiert")}catch(x){toast(L.res.code)}return}
 if(a==="back"){try{if(L.res&&navigator.clipboard)navigator.clipboard.writeText(L.res.code).catch(()=>{})}catch(x){}try{window.close()}catch(x){}setTimeout(()=>{if(P&&P.back)location.href=P.back;else toast("Wechsle zurück zur PokeLearn-App.")},250);return}});
function boot(){P=readPayload();const t=P||DEMO;S.lsStop=t.strict!==false;S.lsMN=!!t.mn;
 lsStart({id:t.id,title:t.title||"Lesetext",text:t.text,lang:t.lang||"de",level:t.level||"mittel",kind:t.kind||"",q:[]});if(!P){const n=document.createElement("p");n.className="muted";n.style.cssText="margin:0;text-align:center;font-size:13px";n.textContent="Probetext – normalerweise öffnet PokeLearn diese Seite mit dem Text, den du lesen sollst.";view().prepend(n)}}
window.addEventListener("hashchange",()=>{lsStop();boot()});
if(ttsOK()){try{speechSynthesis.getVoices()}catch(e){}}
boot();

</script></body></html>
