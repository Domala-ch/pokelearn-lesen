name: Diktat-Stimme
# Records upcoming dictations with a natural voice, so the app can play them at once.
# Every 10 minutes a quick check looks for new texts; only then the voice model is installed and run.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voice
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Look for dictations without a recording
        id: q
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/voice_jobs.py
      - uses: actions/setup-python@v5
        if: steps.q.outputs.todo != '0'
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        if: steps.q.outputs.todo != '0'
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: voice-cb017-v1
      - name: Install the voice model (CPU)
        if: steps.q.outputs.todo != '0'
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.6.0+cpu" "torchaudio==2.6.0+cpu"
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu chatterbox-tts==0.1.7 faster-whisper==1.2.1 "setuptools<81"
          python -c "import perth; assert perth.PerthImplicitWatermarker, 'perth'"
      - name: Record
        if: steps.q.outputs.todo != '0'
        env:
          BUDGET_MIN: "50"
        run: |
          git config user.name "pokelearn-bot"
          git config user.email "pokelearn-bot@users.noreply.github.com"
          python tools/voice_render.py
