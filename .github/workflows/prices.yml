name: Weekly price list
on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  prices:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild cards/prices.json from tcgcsv.com
        run: python3 tools/update_prices.py
      - name: Commit new prices
        id: commit
        run: |
          git config user.name "pokelearn-bot"
          git config user.email "pokelearn-bot@users.noreply.github.com"
          if git diff --quiet -- cards/prices.json; then echo "changed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          git add cards/prices.json
          git commit -m "Preisliste $(date -u +%F)"
          git push
          echo "changed=yes" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'yes'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'yes'
        with:
          path: .
      - id: deployment
        if: steps.commit.outputs.changed == 'yes'
        uses: actions/deploy-pages@v4
